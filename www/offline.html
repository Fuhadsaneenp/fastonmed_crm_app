<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Connection unavailable</title><style>body{font:16px system-ui;background:#f8fafc;color:#004d66;display:grid;place-items:center;min-height:90dvh;margin:24px}main{max-width:360px;text-align:center}p{color:#64748b;line-height:1.6}button{background:#004d66;color:white;border:0;border-radius:12px;padding:16px 24px;font:inherit;min-height:48px}</style><main><h1>Let’s reconnect</h1><p>Check your internet connection to access your CRM.</p><button id="retry">Try again</button><p id="status" role="status"></p></main><script>document.getElementById('retry').onclick=async()=>{try{const response=await fetch('server.json');if(!response.ok)throw Error();const config=await response.json();location.replace(config.url)}catch{document.getElementById('status').textContent='Unable to reconnect. Close and reopen the app to retry.'}};</script></html>
