<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FastonMed CRM · Mobile Preview</title>
<style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15323c;background:#e9e9ef}*{box-sizing:border-box}body{margin:0}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px;background:#fff;border-bottom:1px solid #dce3df}.brand{font-size:21px;font-weight:750;letter-spacing:-.6px}.brand span{color:#319779;font-weight:450}.label{font-size:12px;color:#64777e;margin-top:3px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select,a.control{font:inherit;font-size:13px;border:1px solid #d8e1dc;background:#fff;color:#244753;border-radius:10px;min-height:40px;padding:9px 13px;text-decoration:none;cursor:pointer}button:hover,a.control:hover{background:#edf5f0}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #319779;outline-offset:3px}.stage{height:calc(100dvh - 76px);overflow:auto;position:relative;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#f5f5f8,#e4e4eb);padding:28px 16px}.device-wrap{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:top center}.device-label{display:flex;gap:14px;align-items:center;font-size:13px;color:#858595}.device-label strong{font-weight:600;color:#494954}.phone{position:relative;width:430px;height:902px;padding:12px;background:#151515;border-radius:63px;border:3px solid #929296;box-shadow:0 0 0 2px #b8b8bd,0 20px 48px #35334522;flex:none}.screen{width:402px;height:874px;background:#fff;border-radius:48px;overflow:hidden;display:flex;flex-direction:column;position:relative}.status{height:44px;flex:none;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#142c36;font-size:12px;font-weight:650;position:relative}.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#111;border-radius:20px}.island:after{content:"";position:absolute;right:12px;top:8px;width:12px;height:12px;border-radius:50%;background:#102036;box-shadow:inset 0 0 0 3px #192234}.indicators{display:flex;align-items:center;gap:6px}.battery{width:18px;height:9px;border:1px solid #142c36;border-radius:3px;padding:1px}.battery:after{content:"";display:block;height:100%;width:80%;background:#142c36;border-radius:1px}.app{display:block;width:100%;height:806px;border:0;background:#f8fafc;flex:1;min-height:0}.home-area{height:24px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff}.home{width:130px;height:5px;background:#111;border-radius:20px}.side-button{position:absolute;width:4px;background:#919196;border-radius:4px;left:-6px;top:136px;height:32px}.side-button.two{top:192px;height:52px}.side-button.three{top:258px;height:52px}.side-button.power{left:auto;right:-6px;top:211px;height:77px}.caption{max-width:430px;text-align:center;font-size:12px;color:#72818a;line-height:1.6;margin:0}.android .phone{border-radius:42px}.android .screen{border-radius:29px}.android .island{width:18px;height:18px;top:11px}.android .island:after{display:none}.android .home{width:95px}.live{display:inline-flex;gap:5px;align-items:center;color:#18795d;font-size:11px;font-weight:600;margin-left:10px}.live:before{content:"";width:6px;height:6px;background:#319779;border-radius:50%}@media(max-width:650px){header{height:auto;min-height:76px;padding:14px 16px;flex-wrap:wrap;gap:12px}.tools{gap:6px}.tools button,.tools select,.tools a{min-height:44px}.stage{height:calc(100dvh - 134px);padding-top:20px}.label{max-width:270px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.tablet .phone{width:848px;height:1208px;border-radius:38px}.tablet .screen{width:820px;height:1180px;border-radius:24px}.tablet .island{display:none}.tablet .caption{max-width:760px}.tablet .side-button{display:none}.tablet .home{width:200px}</style></head>
<body><header><div><div class="brand">faston<span>med</span> <span class="live">APP PREVIEW</span></div><div class="label">New app interface · same FastonMed CRM</div></div><div class="tools"><select id="source" aria-label="Preview version"><option value="http://127.0.0.1:8093/dashboard">Home</option><option value="http://127.0.0.1:8093/clients">Clients</option><option value="http://127.0.0.1:8093/tasks?member=my" selected>Tasks</option><option value="http://127.0.0.1:8093/products">Products</option><option value="http://127.0.0.1:8093/people">People</option><option value="http://127.0.0.1:8093/companies">Traders</option><option value="http://127.0.0.1:8093/sales">Invoices</option><option value="http://127.0.0.1:8093/product-expiry">Product Expiry</option><option value="https://crm.fastonmed.com">Live CRM</option></select><select id="device" aria-label="Preview device"><option value="iphone">iPhone 17 Pro</option><option value="android">Android Phone</option><option value="tablet">iPad · Tablet</option></select><button id="fit" type="button">Fit to View</button><button id="actual" type="button">100%</button><button id="reload" type="button">Reload CRM</button><a class="control" href="https://crm.fastonmed.com" target="_blank" rel="noopener">Open CRM ↗</a></div></header>
<main class="stage" id="stage"><div class="device-wrap" id="wrap"><div class="device-label"><strong id="model">iPhone 17 Pro</strong><span id="dimensions">402 × 874</span></div><div class="phone"><span class="side-button"></span><span class="side-button two"></span><span class="side-button three"></span><span class="side-button power"></span><div class="screen"><div class="status" aria-hidden="true"><span id="time">9:41</span><div class="island"></div><div class="indicators"><span>▂▄▆</span><span>◔</span><div class="battery"></div></div></div><iframe class="app" id="crm" title="Live FastonMed CRM mobile app" src="http://127.0.0.1:8093/tasks?member=my" allow="clipboard-write" allowfullscreen></iframe><div class="home-area" aria-hidden="true"><span class="home"></span></div></div></div><p class="caption">Sign in to your existing CRM account. Dashboard figures are loaded from the CRM database; no sample records are shown.</p></div></main>
<script>
const stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap'),frame=document.querySelector('#crm');let fit=true;
function resize(){const tablet=wrap.classList.contains("tablet");const scale=fit?Math.min(1,(stage.clientHeight-64)/(tablet?1230:980),(stage.clientWidth-36)/(tablet?850:434)):1;wrap.style.transform=`scale(${Math.max(.3,scale)})`;stage.style.overflow=fit?'hidden':'auto'}
document.querySelector('#fit').onclick=()=>{fit=true;resize()};document.querySelector('#actual').onclick=()=>{fit=false;resize()};document.querySelector('#reload').onclick=()=>{frame.src=document.querySelector('#source').value};
document.querySelector('#source').onchange=event=>{frame.src=event.target.value};
document.querySelector('#device').onchange=event=>{const android=event.target.value==='android',tablet=event.target.value==='tablet';wrap.classList.toggle('android',android);wrap.classList.toggle('tablet',tablet);document.querySelector('#model').textContent=tablet?'iPad · Tablet':android?'Android Phone':'iPhone 17 Pro';document.querySelector('#dimensions').textContent=tablet?'820 × 1180':'402 × 874';resize()};
new ResizeObserver(resize).observe(stage);resize();
</script></body></html>
