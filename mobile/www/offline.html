<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reconnect to FastonMed</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f8fafc;font:16px system-ui;color:#004d66}main{max-width:360px;padding:24px;text-align:center}button{background:#004d66;color:white;min-height:48px;padding:14px 22px;border:0;border-radius:12px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #51b291;outline-offset:4px}p{color:#64748b;line-height:1.6}</style></head><body><main><h1>Let’s reconnect</h1><p>Check your internet connection to open your FastonMed CRM workspace.</p><button id="retry" type="button">Try Again</button><p role="status" id="status"></p></main><script>document.querySelector('#retry').addEventListener('click',()=>{document.querySelector('#status').textContent='Reconnecting…';location.replace('https://crm.fastonmed.com');});</script></body></html>
